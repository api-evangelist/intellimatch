aid: intellimatch
name: IntelliMatch
description: >-
  IntelliMatch is a transaction and account reconciliation platform originally developed by
  SunGard, now offered by FIS, and since renamed FIS Data Integrity Manager. It performs
  account-level balance and transaction proofing at high volume and drives review, approval,
  exception management and escalation through an integrated workflow engine, so financial
  institutions and corporates can reconcile cash, securities and intercompany activity and track
  data integrity centrally. The product is SWIFT-accredited, embeds machine learning through an AI
  Virtual Reconciler, and is sold either customer-hosted or as the FIS Optimized Reconciliation
  Service (formerly Managed Reconciliation Service). FIS publishes no developer program,
  documentation, OpenAPI or any other machine-readable contract for it; integration is arranged
  commercially. FIS's public API marketplace, Code Connect, carries a different product line and
  is profiled separately.
